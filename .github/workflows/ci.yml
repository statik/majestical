name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rust:
    name: Rust checks and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: origin/main must be resolvable for the parity-reference merge-base below
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Install protoc and just (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Install protoc and just (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler just
      - run: just check
      # macOS-only: the reference is built at the merge-base with main, a
      # commit that can predate the Linux port (main was macOS-only before
      # phase 7C's target gating), so it may not compile here on Linux. The
      # services_parity suite skips loudly when /tmp/maj-ref is absent.
      - name: Build pre-extraction reference binary for the parity harness
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          orig_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base origin/main HEAD)
          git checkout --detach "$merge_base"
          cargo build -p majestical-cli
          cp target/debug/maj /tmp/maj-ref
          git checkout --detach "$orig_sha"
      - run: just test
  mhl-conformance:
    name: ASC MHL conformance (Python reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: brew install just
      - run: just conformance
  encoder-conformance:
    name: Encoder conformance (pinned transformers reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .model-cache
          key: model-siglip2-b16-v1
      # The torch-side reference model (golden.py's AutoModel.from_pretrained)
      # downloads into HF's default cache, separate from .model-cache (our
      # own ONNX artifacts) — keyed on the justfile's contents so a bump to
      # SIGLIP2_TORCH_REVISION there invalidates this cache automatically,
      # with no revision literal duplicated here to drift out of sync.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-reference-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just encoder-conformance
  text-encoder-conformance:
    name: Text-encoder conformance (pinned sentence-transformers reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .model-cache
          key: model-minilm-l6-v2-v1
      # Own key prefix (hf-reference-st-), distinct from encoder-conformance's
      # hf-reference-: both jobs populate ~/.cache/huggingface with different
      # oracle downloads (torch/transformers vs sentence-transformers), GH
      # Actions caches are immutable per key, and the two jobs run in
      # parallel — a shared key means whichever job's save runs second
      # always fails (key already taken) and that job re-downloads its
      # oracle on every run, forever. Both keys still hash the justfile's
      # full contents, so each job's cache still invalidates on its own when
      # the relevant pinned revision changes there.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-reference-st-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just text-encoder-conformance
  whisper-conformance:
    name: Whisper conformance (pinned faster-whisper reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - run: brew install ffmpeg  # say ships with macOS; only ffmpeg needs installing
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .model-cache
          key: model-whisper-large-v3-turbo-q5-v1
      # Per-job HF cache key prefix (hf-whisper-reference-), same rationale
      # as text-encoder-conformance's hf-reference-st-: GH Actions caches are
      # immutable per key, and a shared prefix across parallel jobs means
      # whichever job saves second always fails and re-downloads forever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-reference-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just whisper-conformance
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/version-sync.sh
  gui:
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every Rust step below is macOS-only. The GUI crate depends on
      # majestical-services, whose graph reaches crates/index's Apple-only
      # frameworks (Vision OCR, PDFKit, CoreML) via unconditional objc2
      # dependencies, so `objc2` raises `only works on Apple platforms` on
      # Linux and Windows. Target-gating those is a deferred-phase porting
      # project, not a scaffold fix. The frontend gates stay on all three
      # OSes, and Ubuntu/Windows exercise them fully.
      - name: Install Rust (stable)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      # Ahead of the build: rustfmt needs no compile, so a formatting slip
      # fails in seconds instead of after the whole services graph.
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
        if: runner.os == 'macOS'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        if: runner.os == 'macOS'
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install protoc (lance build dependency, via services)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Floats within the 22 LTS line on purpose: jsdom 30 requires
          # >= 22.22.2, so a pin to an earlier 22.x would break the tests.
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # `pnpm build` is not a cargo prerequisite (a debug build never reads
      # frontendDist) — it is here so a broken production bundle fails now
      # rather than in the release job.
      - run: pnpm check && pnpm lint && pnpm test && pnpm build
        working-directory: apps/desktop
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
        if: runner.os == 'macOS'
      # No bare `cargo build` step: clippy above type-checks every target and
      # the tests link what they need, so building separately only repeats
      # work. `tauri_parity`'s cross-binary check wants a `maj` binary, which
      # lives in the other workspace and would cost a second full compile of
      # the services graph to produce here — it skips loudly in this job and
      # runs locally through `just gui-test`.
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
        if: runner.os == 'macOS'
  gui-e2e:
    name: GUI e2e (WebDriver smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - name: Install protoc (lance build dependency, via services)
        run: brew install protobuf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/desktop/e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/e2e
      - run: pnpm lint
        working-directory: apps/desktop/e2e
      - run: pnpm check
        working-directory: apps/desktop/e2e
      # The debug `maj` binary the fixture-catalog setup shells out to
      # (crates/cli, the other cargo workspace) — separate from the GUI's
      # own src-tauri build below.
      - run: cargo build -p majestical-cli
      # Bundles the frontend (running `pnpm build` via `beforeBuildCommand`)
      # and the debug binary into a `.app`, the same artifact wdio.conf.ts
      # points the tauri-service at. `-b app`: no `.dmg`, which this suite
      # never needs and which only costs build time. The overlay config
      # turns off `createUpdaterArtifacts` — with it on, bundling still
      # succeeds but the CLI then exits non-zero trying to sign the
      # updater tarball with a private key no debug/CI build has.
      - run: pnpm tauri build --debug -b app --config src-tauri/tauri.e2e.conf.json
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop/e2e
  actions-lint:
    name: Workflow lint and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uvx zizmor==1.28.0 .github/workflows/  # bump manually; dependabot can't see uvx pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
