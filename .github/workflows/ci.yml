name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rust:
    name: Rust checks and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: origin/main must be resolvable for the parity-reference merge-base below
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - run: brew install just
      - run: just check
      - name: Build pre-extraction reference binary for the parity harness
        run: |
          set -euo pipefail
          orig_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base origin/main HEAD)
          git checkout --detach "$merge_base"
          cargo build -p majestical-cli
          cp target/debug/maj /tmp/maj-ref
          git checkout --detach "$orig_sha"
      - run: just test
  mhl-conformance:
    name: ASC MHL conformance (Python reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: brew install just
      - run: just conformance
  encoder-conformance:
    name: Encoder conformance (pinned transformers reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .model-cache
          key: model-siglip2-b16-v1
      # The torch-side reference model (golden.py's AutoModel.from_pretrained)
      # downloads into HF's default cache, separate from .model-cache (our
      # own ONNX artifacts) — keyed on the justfile's contents so a bump to
      # SIGLIP2_TORCH_REVISION there invalidates this cache automatically,
      # with no revision literal duplicated here to drift out of sync.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-reference-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just encoder-conformance
  text-encoder-conformance:
    name: Text-encoder conformance (pinned sentence-transformers reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .model-cache
          key: model-minilm-l6-v2-v1
      # Own key prefix (hf-reference-st-), distinct from encoder-conformance's
      # hf-reference-: both jobs populate ~/.cache/huggingface with different
      # oracle downloads (torch/transformers vs sentence-transformers), GH
      # Actions caches are immutable per key, and the two jobs run in
      # parallel — a shared key means whichever job's save runs second
      # always fails (key already taken) and that job re-downloads its
      # oracle on every run, forever. Both keys still hash the justfile's
      # full contents, so each job's cache still invalidates on its own when
      # the relevant pinned revision changes there.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-reference-st-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just text-encoder-conformance
  whisper-conformance:
    name: Whisper conformance (pinned faster-whisper reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install protoc (lance build dependency)
        run: brew install protobuf
      - run: brew install ffmpeg  # say ships with macOS; only ffmpeg needs installing
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .model-cache
          key: model-whisper-large-v3-turbo-q5-v1
      # Per-job HF cache key prefix (hf-whisper-reference-), same rationale
      # as text-encoder-conformance's hf-reference-st-: GH Actions caches are
      # immutable per key, and a shared prefix across parallel jobs means
      # whichever job saves second always fails and re-downloads forever.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-reference-${{ hashFiles('justfile') }}
      - run: brew install just
      - run: just whisper-conformance
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/version-sync.sh
  gui:
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every Rust step below is macOS-only. The GUI crate depends on
      # majestical-services, whose graph reaches crates/index's Apple-only
      # frameworks (Vision OCR, PDFKit, CoreML) via unconditional objc2
      # dependencies, so `objc2` raises `only works on Apple platforms` on
      # Linux and Windows. Target-gating those is a deferred-phase porting
      # project, not a scaffold fix. The frontend gates stay on all three
      # OSes, and Ubuntu/Windows exercise them fully.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        if: runner.os == 'macOS'
        with:
          components: rustfmt, clippy
      # Ahead of the build: rustfmt needs no compile, so a formatting slip
      # fails in seconds instead of after the whole services graph.
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
        if: runner.os == 'macOS'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        if: runner.os == 'macOS'
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install protoc (lance build dependency, via services)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Floats within the 22 LTS line on purpose: jsdom 30 requires
          # >= 22.22.2, so a pin to an earlier 22.x would break the tests.
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # `pnpm build` is not a cargo prerequisite (a debug build never reads
      # frontendDist) — it is here so a broken production bundle fails now
      # rather than in the release job.
      - run: pnpm check && pnpm lint && pnpm test && pnpm build
        working-directory: apps/desktop
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml
        if: runner.os == 'macOS'
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
        if: runner.os == 'macOS'
  actions-lint:
    name: Workflow lint and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uvx zizmor==1.28.0 .github/workflows/  # bump manually; dependabot can't see uvx pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
