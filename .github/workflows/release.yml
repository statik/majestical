name: Release
# One-click releases: run this workflow from main (Actions → Release → Run
# workflow, or `gh workflow run release.yml`). The version is computed from
# conventional commits since the last tag; the release notes are the rolling
# draft release-drafter maintains as PRs merge. Nothing needs a version-bump
# commit — versions are stamped into the build tree by scripts/version-stamp.sh
# and never committed; git tags are the source of truth, and the tag itself is
# created when the release is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 0.2.0 or 0.2.0-rc1. Empty computes it from
          conventional commits since the last tag (fix → patch, feat → minor,
          breaking → major, clamped to 0.x).
        required: false
        default: ""
      publish:
        description: >-
          Publish when the builds finish (creates the git tag and offers the
          update to installed apps). Off leaves a draft to review or discard.
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        if: inputs.version == ''
        uses: mathieudutour/github-tag-action@d28fa2ccfbd16e871a4bdf35e11b3ad1bd56c0c1  # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          # default_bump: false is load-bearing: it makes a history with no
          # feat/fix/breaking commit produce an empty new_tag, which is what
          # stops a notes-only release below. Do not remove it.
          default_bump: false
          release_branches: main
          fetch_all_tags: true
      - id: out
        env:
          IN_VERSION: ${{ inputs.version }}
          PREV_VERSION: ${{ steps.tag.outputs.previous_version }}
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "releases build main; this ran from $GITHUB_REF_NAME" >&2
            echo "fix: dispatch the workflow from the main branch" >&2
            exit 1
          fi
          if [ -n "$IN_VERSION" ]; then
            version="${IN_VERSION#v}"
          elif [ -z "$NEW_TAG" ]; then
            echo "no releasable commits since the last tag (no feat/fix/breaking merges)" >&2
            echo "fix: pass an explicit version to release anyway" >&2
            exit 1
          else
            version="$(./scripts/clamp-version.sh "$PREV_VERSION" "$NEW_VERSION")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"
  # Stamps the rolling draft (maintained by release-drafter.yml as PRs merge)
  # with the release tag and hands its id to the build jobs. Creating the
  # release here, ahead of any build, is what makes the draft single by
  # construction: tauri-action only uploads to an existing release and never
  # runs its own list-then-create. The commitish pin matters: publishing
  # creates the tag there, and main may advance while the builds run.
  draft:
    name: Stamp draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7.7.0
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ needs.version.outputs.version }}
          commitish: ${{ github.sha }}
          # A suffixed version (0.2.0-rc1) is a pipeline dry run; mark it so.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
  # Apple silicon only. `ort-sys` ships no prebuilt ONNX Runtime for
  # x86_64-apple-darwin (its dist table lists aarch64 alone among macOS
  # targets), so an Intel build fails in the build script with "no prebuilt
  # binaries available for target x86_64-apple-darwin" long before anything
  # is bundled. docs/RELEASING.md records the decision and what would undo
  # it. No matrix: one target does not need one, and the draft job above
  # owns release creation regardless.
  desktop:
    name: Desktop app (aarch64-apple-darwin)
    needs: [version, draft]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        with:
          targets: aarch64-apple-darwin
      # No caching anywhere in this workflow — not the cargo build cache, not
      # the pnpm store. A poisoned cache must not be able to reach a published
      # artifact, and a release is slow enough already that the minutes saved
      # are not worth that reachability.
      - name: Install protoc (lance build dependency, via services)
        run: brew install protobuf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          # setup-node v7 caches the package manager's store on its own once
          # package.json names one. Off here for the same reason as above, and
          # stated rather than left to a default that could change.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # Build-time only; not committed. Ends with version-sync.sh, so a stamp
      # that misses a file stops the release here.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/version-stamp.sh "$VERSION"
      # Attaches this target's bundles and latest.json to the draft the
      # `draft` job stamped. With releaseId set, tauri-action never creates a
      # release, so restoring a second target cannot split the draft. The
      # release body is release-drafter's accumulated changelog
      # (.github/release-drafter.yml), not a string in this file.
      #
      # The signing secrets are required, not optional: with a pubkey in
      # tauri.conf.json and createUpdaterArtifacts on, the Tauri CLI refuses
      # to bundle without a private key and this job fails at that step. That
      # is deliberate — a release that silently shipped unsigned bundles would
      # be one no installed app could ever verify an update from.
      #
      # A key that does not match the configured pubkey does NOT fail here; it
      # only logs a warning. docs/RELEASING.md says what to grep for.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.release-id }}
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin
  cli:
    name: maj binary and license bundle
    # Both uploads go into the draft the `draft` job stamped; waiting on the
    # desktop job keeps the upload order stable. They ride one job because
    # both want a macOS Rust toolchain, and the CLI's own build already pays
    # for one.
    needs: [version, draft, desktop]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        with:
          targets: aarch64-apple-darwin
      - name: Install protoc (lance build dependency, via services)
        run: brew install protobuf
      - name: Stamp version
        run: ./scripts/version-stamp.sh "$VERSION"
      # Not a universal binary: `maj` links the same ONNX Runtime the app
      # does, and there is no Intel build of it to lipo against.
      - name: Build maj binary
        run: |
          set -euo pipefail
          cargo build --release -p majestical-cli --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/maj maj
          ./maj --version
      - name: Package and checksum
        run: |
          set -euo pipefail
          tar czf "maj-v${VERSION}-aarch64-apple-darwin.tar.gz" maj
          shasum -a 256 maj-*.tar.gz > checksums.txt
          cat checksums.txt
      # `--features cli` is not optional: cargo-about 0.9 gates its binary
      # behind it, and without the feature `cargo install` succeeds while
      # installing nothing.
      - name: License bundle (cargo-about)
        run: |
          set -euo pipefail
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --manifest-path apps/desktop/src-tauri/Cargo.toml \
            -c about.toml -o licenses.html about.hbs
      # tauri-action has no input for extra release assets, so these are
      # attached separately. `gh release upload` resolves a draft by its
      # pending tag name; `--clobber` makes a re-run of this job replace the
      # assets rather than fail on the ones already there.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" \
            maj-*.tar.gz checksums.txt licenses.html \
            --clobber
  # Publishing is what creates the git tag (at the commitish the draft job
  # pinned) and what makes installed apps see the update. Skipped when the
  # dispatch set publish off; the draft then waits for a human to publish or
  # delete it.
  publish:
    name: Publish release
    needs: [version, draft, desktop, cli]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq '"published " + .tag_name + ": " + .html_url'
