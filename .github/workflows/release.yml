name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/version-sync.sh
      # version-sync.sh proves the five files agree with each other; nothing in
      # it knows what tag is being built. A tag naming a different version than
      # the binaries carry would produce a release that is wrong in the one
      # place users read first.
      - name: Tag names the version being built
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF_NAME" in
            "v$declared" | "v$declared-"*) ;;
            *)
              echo "tag $GITHUB_REF_NAME does not name version $declared" >&2
              echo "fix: tag v$declared (optionally with a -rc1 style suffix)" >&2
              exit 1
              ;;
          esac
          echo "tag ok: $GITHUB_REF_NAME builds $declared"
  desktop:
    name: Desktop app (${{ matrix.target }})
    needs: version-sync
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        with:
          targets: ${{ matrix.target }}
      # No caching anywhere in this workflow — not the cargo build cache, not
      # the pnpm store. A poisoned cache must not be able to reach a published
      # artifact, and a release is slow enough already that the minutes saved
      # are not worth that reachability.
      - name: Install protoc (lance build dependency, via services)
        run: brew install protobuf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          # setup-node v7 caches the package manager's store on its own once
          # package.json names one. Off here for the same reason as above, and
          # stated rather than left to a default that could change.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # Creates the draft release on first run and attaches this target's
      # bundles; the second matrix job finds the same draft and adds its own.
      #
      # The signing secrets are what arm the updater. Without them the Tauri
      # CLI still builds and bundles, just unsigned — which is the state this
      # workflow is designed to run in until the keypair exists (see
      # docs/RELEASING.md). `uploadUpdaterJson` is on so that the arming
      # commit needs no workflow change; until `bundle.createUpdaterArtifacts`
      # is turned on there are no `.sig` files to describe, and latest.json
      # lands listing no platforms.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Majestical ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}
          releaseBody: |
            The Majestical desktop app and the `maj` command-line catalog: scan
            folders into a content-addressed catalog, tag with folksonomy
            semantics, search offline, and converge catalogs across machines
            through a shared folder.

            macOS only, Apple silicon and Intel. Unsigned — Gatekeeper warns on
            first run (`xattr -d com.apple.quarantine`). `licenses.html` lists
            the third-party crates bundled with the app.
  cli:
    name: maj binary and license bundle
    # Both uploads go into the draft the desktop job creates, so they wait for
    # it. They ride one job because both want a macOS Rust toolchain, and the
    # CLI's own build already pays for one.
    needs: [version-sync, desktop]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch tip 2026-08-05)
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install protoc (lance build dependency, via services)
        run: brew install protobuf
      - name: Build universal maj binary
        run: |
          set -euo pipefail
          cargo build --release -p majestical-cli --target aarch64-apple-darwin
          cargo build --release -p majestical-cli --target x86_64-apple-darwin
          lipo -create -output maj \
            target/aarch64-apple-darwin/release/maj \
            target/x86_64-apple-darwin/release/maj
          ./maj --version
      - name: Package and checksum
        run: |
          set -euo pipefail
          tar czf "maj-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz" maj
          shasum -a 256 maj-*.tar.gz > checksums.txt
          cat checksums.txt
      # `--features cli` is not optional: cargo-about 0.9 gates its binary
      # behind it, and without the feature `cargo install` succeeds while
      # installing nothing.
      - name: License bundle (cargo-about)
        run: |
          set -euo pipefail
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --manifest-path apps/desktop/src-tauri/Cargo.toml \
            -c about.toml -o licenses.html about.hbs
      # tauri-action has no input for extra release assets, so these are
      # attached separately. `gh release upload` resolves a draft by its
      # pending tag name; `--clobber` makes a re-run of this job replace the
      # assets rather than fail on the ones already there.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            maj-*.tar.gz checksums.txt licenses.html \
            --clobber
