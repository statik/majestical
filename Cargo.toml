[workspace]
resolver = "2"
members = ["crates/catalog-sqlite", "crates/cli", "crates/core", "crates/describe", "crates/index", "crates/ingest", "crates/sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "3", features = ["serde"] }
proptest = "1"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
assert_cmd = "2"
predicates = "3"
plist = "1.10"
quick-xml = "0.41"
hostname = "0.4"
sha2 = "0.11"
image = "0.25.10"
webp = "0.3.1"
fast_image_resize = "6.1.0"
zstd = "0.13.3"
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
lancedb = "=0.33.0"      # build requires protoc: brew install protobuf
arrow-array = "=58.3.0"  # lockstep with lancedb — do not bump independently
arrow-schema = "=58.3.0"
# Only "rt": the sync VectorStore wrapper drives everything through one
# current-thread runtime's block_on, never spawning or using channels/
# Mutex/Notify, so "sync" (and its Send+Sync-bound API surface) adds nothing.
tokio = { version = "1", features = ["rt"] }
futures = "0.3"
ureq = { version = "3.3.0", features = ["json"] }
base64 = "0.23.0"
toml = "1.1.4"
httpmock = "0.8.3"
whisper-rs = { version = "0.16.0", features = ["metal"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
# Vision's default features pull in AVFoundation/CoreML/CoreMedia/CoreVideo
# binding crates the OCR module never touches; enable only the text-
# recognition surface (objc2-core-foundation is for CGRect bounding boxes).
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNTypes",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNRecognizeTextRequest",
    "objc2-core-foundation",
] }
# PDFKit's default features pull the whole annotation/outline/view surface;
# the pdf module only opens documents, reads page text, and renders one
# thumbnail (`objc2-app-kit` gates `thumbnailOfSize:forBox:` → NSImage).
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "PDFDocument",
    "PDFPage",
    "objc2-app-kit",
] }
# Direct dep only for calling TIFFRepresentation on the NSImage that
# PDFKit's thumbnail call returns.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSImage",
] }

# WATCHLIST (2026-07-30): a `cli`/`index` dev/test build linking lancedb's
# dependency graph (lancedb -> datafusion -> arrow, plus ort) hits macOS
# ld64's 16MB compact-unwind-table cap and prints a linker warning
# ("__eh_frame section too large ... compact unwind table"). Two fixes were
# tried and rejected:
#   - [profile.dev.package."*"] debug = "line-tables-only" (or `false`): no
#     effect — unwind-table emission is tied to the panic strategy
#     (`-C force-unwind-tables`, on for the default `panic = "unwind"`), not
#     to DWARF debug verbosity.
#   - `-C link-args=-Wl,-no_compact_unwind` (forcing the non-compact unwind
#     format to sidestep the cap): DO NOT USE — verified locally that it
#     makes real panics abort the process ("failed to initiate panic, error
#     5") instead of unwinding, which breaks `catch_unwind`-based recovery
#     (`majestical_index::vector_store::catch_corruption`) outright.
# The warning is otherwise harmless (ld64 falls back to slower non-compact
# entries for the functions that don't fit) and release builds don't hit it
# (LTO + codegen-units=1 shrinks the graph well under the cap). Left
# unresolved rather than risk runtime correctness for a cosmetic warning.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = true
codegen-units = 1
