[workspace]
resolver = "2"
members = ["crates/catalog-sqlite", "crates/cli", "crates/core", "crates/ingest", "crates/sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "3", features = ["serde"] }
proptest = "1"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
assert_cmd = "2"
predicates = "3"
plist = "1.10"
quick-xml = "0.41"
hostname = "0.4"
sha2 = "0.11"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = true
codegen-units = 1
