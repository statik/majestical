# The third-party license bundle shipped with each release, built from the
# desktop app's dependency graph (apps/desktop/src-tauri/Cargo.toml). Because
# this config sits at the repo root and the manifest does not, both paths are
# passed explicitly — see the licenses step in .github/workflows/release.yml
# and docs/RELEASING.md.
#
# `accepted` is exactly the license set the graph resolves to today, in
# cargo-about's precedence order: a crate offering a choice is listed under
# the first of these it allows, so Apache-2.0 leading is what puts the
# Apache-or-MIT majority of the ecosystem under Apache-2.0. Nothing
# speculative belongs here — an unlisted license fails the build, which is
# the point: a new dependency on unfamiliar terms stops a release rather than
# quietly joining the bundle.
#
# Comments name a crate only where knowing which one answers "why is that
# license in our bundle at all". Crate counts are deliberately absent: they
# move with every dependency bump, and the generated HTML counts one entry per
# crate *version* while a by-name census counts fewer — foldhash alone appears
# twice, at 0.1.5 and 0.2.0. A number here would be wrong in one of the two
# senses on the day it was written. Run the bundle if you want the census.
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",                 # ring and its dependencies
  "Unicode-3.0",         # the icu_* crates, via tauri's URL and text handling
  "MPL-2.0",             # cssparser and selectors, via tauri
  "Zlib",                # foldhash
  "BSL-1.0",             # xxhash-rust, the catalog's content-address hash
  "Unlicense",           # whisper-rs, whisper-rs-sys
  "CDLA-Permissive-2.0"  # webpki-roots
]

# Both release targets, so a crate whose license differs per platform is
# caught here rather than in one of the two matrix builds.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

# Neither ships in the bundle: build scripts run on the builder and dev
# dependencies are test-only.
ignore-build-dependencies = true
ignore-dev-dependencies = true
