[package]
name = "majestical-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone GUI workspace (phase 7 spec §7): the headless workspace's CI
# never compiles the Tauri tree, and this tree never compiles headless-only
# test suites.
[workspace]

[lib]
name = "majestical_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
# `relaunch()` after an update installs. Registered now: unlike the updater,
# this plugin takes no configuration and so cannot fail to initialize.
tauri-plugin-process = "2.3.1"
majestical-services = { path = "../../../crates/services" }
# The GUI owns the one cancellable ingest run: `engine::{RunControl,
# CancelFlag, ProgressEvent}` is the seam `services::ingest::run_ingest`
# takes, and `majestical-services` re-exports none of it.
majestical-ingest = { path = "../../../crates/ingest" }
# `rc`: `ingest_state` hands out the finished run behind the `Arc` the job
# thread published it under. `IngestRun` is not `Clone` (it carries
# `engine::Outcome`), so an owned wire struct either shares the `Arc` or
# re-serializes the whole outcome on every poll.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
# The machine id and author every event this app writes is stamped with.
hostname = "0.4"
# `thumb://` asset ids arrive percent-encoded (`convertFileSrc` runs
# `encodeURIComponent`), so the protocol handler decodes the path segment.
percent-encoding = "2"
# e2e-only, registered in `lib.rs` behind `#[cfg(debug_assertions)]`: no
# debug-only dependency section exists in Cargo, so these ship in every
# build, but only a debug build ever calls their `init()`. Execute/mock/log
# bridge for WebdriverIO (`browser.tauri.*`) and the embedded W3C WebDriver
# server WebdriverIO's `embedded` driver provider connects to.
tauri-plugin-wdio = "1.3.0"
tauri-plugin-wdio-webdriver = "1.3.0"

[dev-dependencies]
tempfile = "3"
# Builds the mock `AppHandle` the config-dir env-seam test resolves against
# (`tauri::test::mock_app`) — a dev-only feature of the crate already in
# `[dependencies]`, not a new dependency.
tauri = { version = "2.11.5", features = ["test"] }
# The command tests seed real catalogs: `majestical-core` builds the `Op`
# literals to emit, and `majestical-index` computes the exact `BlobStore`
# paths the thumb tests plant blobs at (rather than hand-deriving the layout
# and risking drift from it).
majestical-core = { path = "../../../crates/core" }
majestical-index = { path = "../../../crates/index" }

[lints.clippy]
# Copy of the root workspace's lint table (a standalone workspace cannot
# inherit it) — keep in lockstep manually; version-sync does not check this.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
