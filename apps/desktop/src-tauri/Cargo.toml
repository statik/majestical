[package]
name = "majestical-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone GUI workspace (phase 7 spec §7): the headless workspace's CI
# never compiles the Tauri tree, and this tree never compiles headless-only
# test suites.
[workspace]

[lib]
name = "majestical_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
# Registered by the arming commit, not here — see `run` in lib.rs. The dep
# ships now so capabilities/default.json's `updater:default` ACL resolves.
tauri-plugin-updater = "2.10.1"
# `relaunch()` after an update installs. Registered now: unlike the updater,
# this plugin takes no configuration and so cannot fail to initialize.
tauri-plugin-process = "2.3.1"
majestical-services = { path = "../../../crates/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The machine id and author every event this app writes is stamped with.
hostname = "0.4"
# `thumb://` asset ids arrive percent-encoded (`convertFileSrc` runs
# `encodeURIComponent`), so the protocol handler decodes the path segment.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
# The command tests seed real catalogs: `majestical-core` builds the `Op`
# literals to emit, and `majestical-index` computes the exact `BlobStore`
# paths the thumb tests plant blobs at (rather than hand-deriving the layout
# and risking drift from it).
majestical-core = { path = "../../../crates/core" }
majestical-index = { path = "../../../crates/index" }

[lints.clippy]
# Copy of the root workspace's lint table (a standalone workspace cannot
# inherit it) — keep in lockstep manually; version-sync does not check this.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
