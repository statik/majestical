[package]
name = "majestical-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maj"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"          # CLI output is the product
print_stderr = "allow"          # diagnostics go to stderr; stdout is data
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[dependencies]
majestical-core = { path = "../core" }
majestical-services = { path = "../services" }
majestical-sync = { path = "../sync" }
majestical-ingest = { path = "../ingest" }
majestical-index = { path = "../index" }
majestical-describe = { path = "../describe" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ulid.workspace = true
walkdir.workspace = true
xxhash-rust.workspace = true
plist.workspace = true
# `maj mcp`: stdio JSON-RPC server. Only this crate opens a tokio runtime
# (built manually in `mcp_cmd::serve`, not `#[tokio::main]` — every other
# subcommand stays synchronous) and only for this one subcommand.
rmcp.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
assert_cmd.workspace = true
httpmock.workspace = true
predicates.workspace = true
tempfile.workspace = true
# Lets a test read `catalog.db` straight off disk to assert `cmd_pull`
# itself applied events, not a later `maj` invocation. Same workspace pin
# `catalog-sqlite` depends on — see the root `Cargo.toml` comment on why
# it's pinned once, not per-crate.
rusqlite.workspace = true
# `index run`'s compute (thumbnail/embedding decode, blob zstd) moved to
# `majestical-services` (see `crates/services/src/index/run.rs`); only the
# integration test suites (index_smoke.rs, caption_smoke.rs, etc.) still
# decode images or zstd blobs directly to build fixtures/assert on blob
# bytes, and only sync_smoke.rs/caption_smoke.rs/index_smoke.rs read
# `catalog.db` straight off disk the same way the `rusqlite` pin above does.
majestical-catalog-sqlite = { path = "../catalog-sqlite" }
image.workspace = true
zstd.workspace = true
# inbox_smoke.rs computes real xxh64 hashes for its manifest fixtures,
# matching `contribution.json`'s wire format. `[dependencies]` above only
# pulls in `xxh3` (catalog identity); this is additive, same pattern as
# `crates/ingest/Cargo.toml`.
xxhash-rust = { workspace = true, features = ["xxh64"] }
# Cucumber acceptance harness, pinned to match crates/core's and
# crates/ingest's versions.
cucumber = "0.23"
futures = "0.3"
# inbox_smoke.rs's quiescence-depth test needs to backdate directory
# mtimes deterministically (std has no portable, non-file way to do this);
# filetime wraps utimensat/SetFileTime so it works for directories on
# every platform this crate targets.
filetime.workspace = true

[[test]]
name = "acceptance"
harness = false

[[test]]
name = "inbox_acceptance"
harness = false
