[package]
name = "majestical-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maj"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"          # CLI output is the product
print_stderr = "allow"          # diagnostics go to stderr; stdout is data
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[dependencies]
majestical-core = { path = "../core" }
majestical-sync = { path = "../sync" }
majestical-catalog-sqlite = { path = "../catalog-sqlite" }
majestical-ingest = { path = "../ingest" }
majestical-index = { path = "../index" }
majestical-describe = { path = "../describe" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ulid.workspace = true
walkdir.workspace = true
xxhash-rust.workspace = true
plist.workspace = true
zstd.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
httpmock.workspace = true
predicates.workspace = true
tempfile.workspace = true
# Not a workspace dependency (only `catalog-sqlite` depends on it directly,
# outside `[workspace.dependencies]`) — pinned here to the same
# version/features so a test can read `catalog.db` straight off disk and
# assert `cmd_pull` itself applied events, not a later `maj` invocation.
rusqlite = { version = "0.37", features = ["bundled"] }
# Cucumber acceptance harness, pinned to match crates/core's and
# crates/ingest's versions.
cucumber = "0.23"
futures = "0.3"

[[test]]
name = "acceptance"
harness = false
