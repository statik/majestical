[package]
name = "majestical-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
majestical-core = { path = "../core" }
serde = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
fast_image_resize = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
tokenizers = { workspace = true }
# Regular dependency, not dev-only: the HEIC/HEIF decode path shells out to
# macOS's `sips` and needs a real output file on disk at runtime.
tempfile = { workspace = true }
lancedb = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

# The Apple-native seams: Vision OCR, PDFKit, the CoreML EP, and whisper's
# Metal backend exist only on macOS. Everything else in this crate builds
# and runs everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }
whisper-rs = { workspace = true, features = ["metal"] }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-vision = { workspace = true }
objc2-pdf-kit = { workspace = true }
objc2-app-kit = { workspace = true }

# Same crates minus the Apple-only backends. A dep needed on every
# platform must appear in BOTH tables — additions here or above, check both.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { workspace = true }
whisper-rs = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
