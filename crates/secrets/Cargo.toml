[package]
name = "majestical-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

# The macOS Keychain binding. Target-gated because Security.framework only
# exists on Apple platforms — everywhere else `SystemKeyStore` is a stub.
# `-sys` is the binding's own dependency, named here only for
# `errSecItemNotFound`; both match what the lockfile already resolves.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
